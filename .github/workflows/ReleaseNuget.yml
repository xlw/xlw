name: Build Nuget
 
on:
  push:
    branches: [ master, release, prerelease, dev, 2026-update ]
  pull_request:
    branches: [ dev ]
 
jobs:
  build:
    runs-on: windows-latest
    outputs:
        output1: ${{ steps.Build_Package.outputs.version }}
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/prerelease' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/2026-update'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Install matching .NET 11 x86 SDK
        shell: pwsh
        run: |
          $sdkLine = dotnet --list-sdks | Where-Object { $_ -match '^11\.' } | Select-Object -Last 1
          if (-not $sdkLine -or $sdkLine -notmatch '^(?<Version>\S+)') {
            throw "Could not determine the installed .NET 11 SDK version."
          }
          $sdkVersion = $Matches.Version
          $installDir = Join-Path $env:LOCALAPPDATA "dotnet-sdk-x86"
          $installScript = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installScript
          & $installScript -Version $sdkVersion -Architecture x86 -InstallDir $installDir -NoPath
          $hostPack = Join-Path $installDir "packs\Microsoft.NETCore.App.Host.win-x86\$sdkVersion"
          if (-not (Test-Path $hostPack)) {
            throw "The .NET $sdkVersion x86 host pack was not installed."
          }
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1
      - name: Setup Nuget.exe
        uses: nuget/setup-nuget@v1
      - name: Build native and .NET packages
        shell: pwsh
        run: .\Build-Libraries.ps1
        id: Build_Package
      - uses: actions/upload-artifact@v4
        with:
            name: nuget-artifact
            path: nuget_pack/*.nupkg
  release:
    runs-on: windows-latest
    needs: [build]
    if: github.ref == 'refs/heads/release'  || github.ref ==  'refs/heads/prerelease'
    steps:
      - uses: actions/download-artifact@v4
        with:
            name: nuget-artifact
      - name: Tag commit
        uses: tvdias/github-tagger@v0.0.1
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "${{ needs.build.outputs.output1   }}"
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.nupkg"
          prerelease: ${{ github.ref ==  'refs/heads/prerelease'}}
          draft: false
          tag: "${{  needs.build.outputs.output1  }}"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Nuget to Github
        uses: tanaka-takayoshi/nuget-publish-to-github-packages-action@v2.1
        with:
          nupkg-path:  "*.nupkg"
          repo-owner:  'xlw'
          gh-user:  'xlw'
          token:  ${{ secrets.GITHUB_TOKEN }}       
      - name: Push Nuget to Nuget.org
        run: dotnet nuget push *.nupkg --api-key ${{ secrets.XLWNUGET }} --source https://api.nuget.org/v3/index.json
  Push2Feedz:
    runs-on: windows-latest
    needs: [build]
    if: github.ref == 'refs/heads/release'  || github.ref ==  'refs/heads/prerelease'  || github.ref ==  'refs/heads/master' 
    steps:   
      - uses: actions/download-artifact@v4
        with:
            name: nuget-artifact
      - name: Push Nuget to f.feedz.io
        run: dotnet nuget push *.nupkg --api-key ${{ secrets.FEEDZIO }} --source https://f.feedz.io/xlw/xlw/nuget